th d="M670 124l7 7h20l-7 -7zM690 124l7 7v20l-7 -7z" fill="#2f3540"/><rect x="670" y="124" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:0.90s"><path d="M670 144l7 7h20l-7 -7zM690 144l7 7v20l-7 -7z" fill="#2f3540"/><rect x="670" y="144" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:0.92s"><path d="M710 84l7 7h20l-7 -7zM730 84l7 7v20l-7 -7z" fill="#2f3540"/><rect x="710" y="84" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:0.99s"><path d="M730 84l7 7h20l-7 -7zM750 84l7 7v20l-7 -7z" fill="#2f3540"/><rect x="730" y="84" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:1.06s"><path d="M750 84l7 7h20l-7 -7zM770 84l7 7v20l-7 -7z" fill="#2f3540"/><rect x="750" y="84" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:1.13s"><path d="M770 84l7 7h20l-7 -7zM790 84l7 7v20l-7 -7z" fill="#2f3540"/><rect x="770" y="84" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:1.20s"><path d="M790 84l7 7h20l-7 -7zM810 84l7 7v20l-7 -7z" fill="#2f3540"/><rect x="790" y="84" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:1.10s"><path d="M750 104l7 7h20l-7 -7zM770 104l7 7v20l-7 -7z" fill="#2f3540"/><rect x="750" y="104" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:1.14s"><path d="M750 124l7 7h20l-7 -7zM770 124l7 7v20l-7 -7z" fill="#2f3540"/><rect x="750" y="124" width="20" height="20" fill="url(#steel)" stroke="#0e0e11" stroke-width="1"/></g><g class="px" style="animation-delay:1.18s"><path d="M750 144l7 7h20l-7 -7zM770 144l7 7v20l-7 -7z" f